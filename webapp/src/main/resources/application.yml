server:
  port: 8080

spring:
  application:
    name: webapp
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/erechnung}
    username: ${SPRING_DATASOURCE_USERNAME:erechnung}
    password: ${SPRING_DATASOURCE_PASSWORD:erechnung}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate.jdbc.time_zone: Europe/Berlin
  flyway:
    enabled: true
    baseline-on-migrate: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
  servlet:
    multipart:
      max-file-size: ${MAX_UPLOAD_MB:25}MB
      max-request-size: ${MAX_UPLOAD_MB:25}MB

erechnung:
  data-dir: ${DATA_DIR:/data}
  max-upload-mb: ${MAX_UPLOAD_MB:25}
  rounding-tolerance: ${ROUNDING_TOLERANCE:0.02}
  invoice-engine-url: ${INVOICE_ENGINE_URL:http://localhost:8090}
  extraction-poll-ms: ${EXTRACTION_POLL_MS:1500}
  # Nur zur Anzeige im Admin-Bereich (Durchsetzung erfolgt in der invoice-engine).
  kosit-enabled: ${KOSIT_ENABLED:false}
  watch:
    enabled: ${WATCH_ENABLED:false}
    input-dir: ${WATCH_INPUT_DIR:/data/watch/in}
    output-dir: ${WATCH_OUTPUT_DIR:/data/watch/out}
    interval-seconds: ${WATCH_INTERVAL:60}
  jwt:
    secret: ${JWT_SECRET:change-me-please-use-a-long-random-value-min-32}
    expiry-minutes: ${JWT_EXPIRY_MINUTES:480}
  admin:
    email: ${ADMIN_EMAIL:admin@example.com}
    password: ${ADMIN_PASSWORD:change-me-in-production}
  brand:
    name: ${BRAND_NAME:senapsa}
    product-title: ${BRAND_PRODUCT_TITLE:eRechnung-Konverter}
    primary-color: ${BRAND_PRIMARY_COLOR:#0B5FFF}
  license:
    enforcement: ${LICENSE_ENFORCEMENT:false}
    controller-url: ${LICENSE_CONTROLLER_URL:}
    key: ${LICENSE_KEY:}

springdoc:
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

logging:
  level:
    root: ${LOGLEVEL:INFO}
  # Strukturierte JSON-Logs nach stdout (Spring Boot Structured Logging, ECS).
  structured:
    format:
      console: ecs
