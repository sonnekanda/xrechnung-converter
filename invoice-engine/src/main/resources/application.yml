server:
  port: 8090

spring:
  application:
    name: invoice-engine
  jackson:
    default-property-inclusion: non_null

erechnung:
  kosit-enabled: ${KOSIT_ENABLED:false}
  kosit-url: ${KOSIT_URL:http://kosit-validator:8092/}
  zugferd-enabled: ${ZUGFERD_ENABLED:false}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

logging:
  level:
    root: ${LOGLEVEL:INFO}
  # Strukturierte JSON-Logs nach stdout (Spring Boot Structured Logging, ECS).
  structured:
    format:
      console: ecs
