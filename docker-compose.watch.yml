# =============================================================================
# Overlay: on-premise Host-Ordner für die Ordner-Automatik einbinden.
# Bindet die in der .env gesetzten Host-Ordner in den Watch-Ein-/Ausgang.
#
# Nutzung:
#   docker compose -f docker-compose.yml -f docker-compose.watch.yml up -d
#
# (Cloud/SFTP-Betrieb ohne Host-Ordner: einfach ohne dieses Overlay starten.)
# =============================================================================
services:
  webapp:
    volumes:
      - "${WATCH_HOST_INPUT_DIR:-C:/abas/in}:/data/watch/in"
      - "${WATCH_HOST_OUTPUT_DIR:-C:/abas/out}:/data/watch/out"
