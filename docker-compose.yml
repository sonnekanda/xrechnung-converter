# =============================================================================
# senapsa eRechnung-Konverter — Stack (ein Compose-Stack pro Kunde)
# Start:  cp .example.env .env  &&  docker compose up -d
# Netz "sic-net" intern; nur WEBAPP_PORT nach aussen exponiert.
# =============================================================================

x-common-env: &common-env
  TZ: ${TZ:-Europe/Berlin}
  LOGLEVEL: ${LOGLEVEL:-INFO}

services:

  webapp:
    build:
      context: ./webapp
    image: registry.senapsa.io/erechnung/webapp:${IMAGE_TAG:-latest}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      invoice-engine:
        condition: service_healthy
    environment:
      <<: *common-env
      SPRING_DATASOURCE_URL: jdbc:postgresql://${POSTGRES_HOST}:${POSTGRES_PORT}/${POSTGRES_DB}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      REDIS_HOST: ${REDIS_HOST}
      REDIS_PORT: ${REDIS_PORT}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRY_MINUTES: ${JWT_EXPIRY_MINUTES:-480}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-25}
      EXTRACTION_URL: ${EXTRACTION_URL}
      INVOICE_ENGINE_URL: ${INVOICE_ENGINE_URL}
      ROUNDING_TOLERANCE: ${ROUNDING_TOLERANCE:-0.02}
      DEFAULT_VAT_RATE: ${DEFAULT_VAT_RATE:-19}
      TARGET_SYNTAX: ${TARGET_SYNTAX:-UBL}
      KOSIT_ENABLED: ${KOSIT_ENABLED:-false}
      BRAND_NAME: ${BRAND_NAME:-senapsa}
      BRAND_PRODUCT_TITLE: ${BRAND_PRODUCT_TITLE:-eRechnung-Konverter}
      BRAND_PRIMARY_COLOR: ${BRAND_PRIMARY_COLOR:-#0B5FFF}
      BRAND_LOGO_PATH: ${BRAND_LOGO_PATH:-}
      # Ordner-Automatik (Watch-Folder, optional "Kann")
      WATCH_ENABLED: ${WATCH_ENABLED:-false}
      WATCH_INPUT_DIR: ${WATCH_INPUT_DIR:-/data/watch/in}
      WATCH_OUTPUT_DIR: ${WATCH_OUTPUT_DIR:-/data/watch/out}
      WATCH_INTERVAL: ${WATCH_INTERVAL:-60}
      # Host-Ordner zur Anzeige in der Oberflaeche; derselbe Wert steuert oben
      # den Volume-Bind (leer = internes Volume, Pfad = Bind auf den Host-Ordner).
      WATCH_HOST_INPUT_DIR: ${WATCH_HOST_INPUT_DIR:-}
      WATCH_HOST_OUTPUT_DIR: ${WATCH_HOST_OUTPUT_DIR:-}
      # Lizenzcontroller-Schnittstelle (Durchsetzung optional, Default aus)
      LICENSE_ENFORCEMENT: ${LICENSE_ENFORCEMENT:-false}
      LICENSE_CONTROLLER_URL: ${LICENSE_CONTROLLER_URL:-}
      LICENSE_KEY: ${LICENSE_KEY:-}
      # Eigene Firma (optionaler Erst-Seed; danach im Admin-Bereich pflegbar)
      COMPANY_NAME: ${COMPANY_NAME:-}
      COMPANY_STREET: ${COMPANY_STREET:-}
      COMPANY_ZIP: ${COMPANY_ZIP:-}
      COMPANY_CITY: ${COMPANY_CITY:-}
      COMPANY_COUNTRY: ${COMPANY_COUNTRY:-DE}
      COMPANY_VATID: ${COMPANY_VATID:-}
      COMPANY_TAXNO: ${COMPANY_TAXNO:-}
      COMPANY_CONTACT: ${COMPANY_CONTACT:-}
      COMPANY_EMAIL: ${COMPANY_EMAIL:-}
      COMPANY_PHONE: ${COMPANY_PHONE:-}
      COMPANY_IBAN: ${COMPANY_IBAN:-}
      COMPANY_BIC: ${COMPANY_BIC:-}
      COMPANY_PAYMENT_TERMS: ${COMPANY_PAYMENT_TERMS:-}
    ports:
      - "${WEBAPP_PORT:-8080}:8080"
    volumes:
      - app-data:/data
      # Ordner-Automatik: Standard = internes Volume (Cloud/SFTP – kein Host-Setup
      # nötig). Für on-premise WATCH_HOST_INPUT_DIR/OUTPUT_DIR in der .env auf einen
      # Host-Ordner setzen (z.B. C:/abas/in) -> dann Bind-Mount statt Volume.
      # Vor dem Start bei gesetzten Host-Ordnern scripts/preflight-check.sh laufen
      # lassen (verhindert das stille Anlegen leerer Ordner an falscher Stelle).
      - "${WATCH_HOST_INPUT_DIR:-watch-in}:/data/watch/in"
      - "${WATCH_HOST_OUTPUT_DIR:-watch-out}:/data/watch/out"
    networks: [sic-net]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s

  extraction-worker:
    build:
      context: ./extraction-worker
    image: registry.senapsa.io/erechnung/extraction-worker:${IMAGE_TAG:-latest}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      <<: *common-env
      POSTGRES_HOST: ${POSTGRES_HOST}
      POSTGRES_PORT: ${POSTGRES_PORT}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      REDIS_HOST: ${REDIS_HOST}
      REDIS_PORT: ${REDIS_PORT}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      OCR_URL: ${OCR_URL}
      WATCH_ENABLED: ${WATCH_ENABLED:-false}
      WATCH_INPUT_DIR: ${WATCH_INPUT_DIR:-/data/watch/in}
      WATCH_OUTPUT_DIR: ${WATCH_OUTPUT_DIR:-/data/watch/out}
      WATCH_INTERVAL: ${WATCH_INTERVAL:-60}
    volumes:
      - app-data:/data
    networks: [sic-net]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  ocr-worker:
    build:
      context: ./ocr-worker
    image: registry.senapsa.io/erechnung/ocr-worker:${IMAGE_TAG:-latest}
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    environment:
      <<: *common-env
      REDIS_HOST: ${REDIS_HOST}
      REDIS_PORT: ${REDIS_PORT}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    volumes:
      - app-data:/data
    networks: [sic-net]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8001/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  invoice-engine:
    build:
      context: ./invoice-engine
    image: registry.senapsa.io/erechnung/invoice-engine:${IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      <<: *common-env
      KOSIT_ENABLED: ${KOSIT_ENABLED:-false}
      KOSIT_URL: ${KOSIT_URL:-http://kosit-validator:8092/}
      ZUGFERD_ENABLED: ${ZUGFERD_ENABLED:-false}
    volumes:
      - app-data:/data
    networks: [sic-net]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8090/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s

  # Zweite unabhaengige amtliche Validierung (offizielle KoSIT-XRechnung-Konfig).
  kosit-validator:
    build:
      context: ./kosit-validator
    image: registry.senapsa.io/erechnung/kosit-validator:${IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      <<: *common-env
    networks: [sic-net]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8092/server/health"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 180s

  postgres:
    image: postgres:17.2-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      TZ: ${TZ:-Europe/Berlin}
    volumes:
      - pg-data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    networks: [sic-net]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    networks: [sic-net]
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  sic-net:
    driver: bridge

volumes:
  app-data:
  # Watch-Ein-/Ausgang als internes Volume (Standard). Bei gesetzten
  # WATCH_HOST_INPUT_DIR/OUTPUT_DIR werden stattdessen die Host-Ordner gebunden.
  watch-in:
  watch-out:
  pg-data:
  redis-data:
